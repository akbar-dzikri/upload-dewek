name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Prevent concurrent deploys
    concurrency:
      group: deploy-upload-dewek
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm run test:coverage

      - name: Build Dashboard
        run: |
          cd dashboard
          npm ci
          npm run build

      - name: Backup D1 before migrations
        run: |
          mkdir -p backup
          pnpm exec wrangler d1 export upload_dewek_db --remote --config wrangler.deploy.jsonc --output backup/pre-migrate-${{ github.sha }}.sql || echo "backup export failed (non-blocking)"
          ls -lh backup/ || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 migrations (remote)
        run: pnpm exec wrangler d1 migrations apply upload_dewek_db --remote --config wrangler.deploy.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker to upload-dewek.dikicodes.com
        run: pnpm exec wrangler deploy --config wrangler.deploy.jsonc --minify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify health (retry + JSON check)
        run: |
          HEALTH_URL=""
          for i in 1 2 3 4 5; do
            echo "Attempt $i/5: checking https://upload-dewek.dikicodes.com/health"
            if curl -fsS https://upload-dewek.dikicodes.com/health | grep -q '"status":"ok"'; then
              echo "Health OK on custom domain"
              HEALTH_URL="https://upload-dewek.dikicodes.com"
              break
            fi
            echo "Custom domain not ready, trying workers.dev..."
            if curl -fsS https://upload-dewek.akbardzkr05.workers.dev/health | grep -q '"status":"ok"'; then
              echo "Health OK on workers.dev"
              HEALTH_URL="https://upload-dewek.akbardzkr05.workers.dev"
              break
            fi
            if [ $i -eq 5 ]; then
              echo "Health check failed after 5 attempts"
              exit 1
            fi
            sleep 5
          done
          echo "Using HEALTH_URL=$HEALTH_URL"
          curl -fsS "$HEALTH_URL/health" | python3 -m json.tool
          curl -fsS "$HEALTH_URL/healthz" | grep -q ok && echo "healthz ok"
          # Best-effort verify custom domain also eventually
          curl -fsS https://upload-dewek.dikicodes.com/health | grep -q '"status":"ok"' && echo "custom domain health confirmed" || echo "custom domain health not yet ready (workers.dev is primary)"

      - name: E2E live via app domain
        run: |
          if curl -fsS https://upload-dewek.dikicodes.com/health | grep -q '"status":"ok"'; then
            E2E_URL="https://upload-dewek.dikicodes.com"
          else
            E2E_URL="https://upload-dewek.akbardzkr05.workers.dev"
            echo "custom domain not ready, falling back to workers.dev for E2E"
          fi
          echo "E2E_BASE_URL=$E2E_URL"
          E2E_BASE_URL=$E2E_URL E2E_API_KEY=ud_local_test_key_12345 pnpm exec vitest run tests/e2e.live.test.ts --reporter=verbose
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Rollback on failure
        if: failure()
        run: |
          echo "::error::Deploy failed — rollback required"
          echo "1) Disable via Cloudflare dashboard or wrangler rollback"
          echo "2) D1 backup: backup/pre-migrate-${{ github.sha }}.sql (restore via wrangler d1 execute --file or d1 import)"
          echo "3) Revert commit: git revert ${{ github.sha }} && git push"

      - name: Deploy Dashboard (optional, via Pages)
        if: false # enable when dashboard is ready for Pages
        run: |
          cd dashboard
          npm ci
          npm run build
          npx wrangler pages deploy dist --project-name=upload-dewek-dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
