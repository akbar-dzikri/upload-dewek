name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Prevent concurrent deploys
    concurrency:
      group: deploy-upload-dewek
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Build Dashboard
        run: |
          cd dashboard
          npm ci
          npm run build

      - name: Apply D1 migrations (remote)
        run: pnpm exec wrangler d1 migrations apply upload_dewek_db --remote --config wrangler.deploy.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker to upload-dewek.dikicodes.com
        run: pnpm exec wrangler deploy --config wrangler.deploy.jsonc --minify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify health
        run: |
          sleep 10
          curl -f https://upload-dewek.dikicodes.com/health || curl -f https://upload-dewek.akbardzkr05.workers.dev/health

      - name: Deploy Dashboard (optional, via Pages)
        if: false # enable when dashboard is ready for Pages
        run: |
          cd dashboard
          npm ci
          npm run build
          npx wrangler pages deploy dist --project-name=upload-dewek-dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
