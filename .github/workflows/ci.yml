name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Build (Dashboard)
        run: |
          cd dashboard
          npm ci
          npm run build

      - name: Build (Workers)
        run: pnpm exec wrangler deploy --config wrangler.deploy.jsonc --dry-run --minify

      - name: Security audit
        run: pnpm audit --audit-level=high

  # Optional: add integration tests with local D1/R2 via wrangler dev --local in future
